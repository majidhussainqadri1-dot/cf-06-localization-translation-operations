name: CF-06 Exact Source Sync

on:
  push:
    branches:
      - codex/cf-06-foundation-0.1.0

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack exact source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "8613e22e2aa9e3b2dae71b3615f0adc64d9fe7c250c698404361cffbc83fbd72  /tmp/source.tar.gz" | sha256sum -c -
          mkdir /tmp/cf06-source
          tar -xzf /tmp/source.tar.gz -C /tmp/cf06-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/cf06-source/. .
          test ! -e bootstrap/source.part-00
          bash tools/quality-check.sh

      - name: Commit exact source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete CF-06 source candidate 1.0.0-rc.1"
          git push
