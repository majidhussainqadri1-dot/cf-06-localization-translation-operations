name: Export CF-06 Source for Review

on:
  push:
    branches: ['codex/cf-06-foundation-0.1.0']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create exact-head source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=zip --output=export/cf06-exact-head-source.zip HEAD
          sha256sum export/cf06-exact-head-source.zip > export/SHA256SUMS
      - name: Upload exact-head source
        uses: actions/upload-artifact@v4
        with:
          name: cf06-exact-head-source
          path: export/
          if-no-files-found: error
