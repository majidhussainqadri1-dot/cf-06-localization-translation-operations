name: CF-06 Corrective Bootstrap

on:
  push:
    branches: ['codex/cf-06-foundation-0.1.0']

permissions:
  contents: write

concurrency:
  group: cf06-corrective-bootstrap
  cancel-in-progress: true

jobs:
  apply-corrective-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/cf-06-foundation-0.1.0

      - name: Decode and commit complete corrective source
        shell: bash
        run: |
          set -euo pipefail
          cat .cf06-payload/part-00 .cf06-payload/part-01-fixed .cf06-payload/part-{02..11} | base64 -d > /tmp/cf06-corrections.tar.gz
          echo '5d461cad54d64456a19ef900e3cd33b3fb9f3d180f10b94d9e7c194f37820724  /tmp/cf06-corrections.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cf06-corrections.tar.gz -C .
          rm -rf .cf06-payload .cf06-fixed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete CF-06 three-plan corrective implementation'
          git push --force-with-lease origin HEAD:codex/cf-06-foundation-0.1.0
          git ls-remote --exit-code origin refs/heads/codex/cf-06-foundation-0.1.0
