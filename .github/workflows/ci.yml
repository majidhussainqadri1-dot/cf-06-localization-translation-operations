name: CF-06 Complete Quality Gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Exact-source quality gate
        run: bash tools/quality-check.sh

  package:
    name: deterministic package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic candidate
        run: |
          python3 tools/build-release.py
          (cd dist && sha256sum -c SHA256SUMS)
          unzip -t dist/*.zip
      - name: Rebuild parity
        run: |
          first=$(sha256sum dist/*.zip | awk '{print $1}')
          python3 tools/build-release.py >/tmp/rebuild.txt
          second=$(sha256sum dist/*.zip | awk '{print $1}')
          test "$first" = "$second"
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cf-06-complete-source-candidate
          path: |
            dist/*.zip
            dist/MANIFEST.json
            dist/SBOM.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
