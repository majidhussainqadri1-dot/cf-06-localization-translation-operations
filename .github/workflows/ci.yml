name: CF-06 Complete Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cf06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SLTO_DATA_ENCRYPTION_KEYS: '{"ci-data":"Y2ktZGF0YS1rZXktMzItYnl0ZXMtbG9uZy0wMDAwMDA="}'
      SLTO_ACTIVE_DATA_KEY_ID: ci-data
      SLTO_BUNDLE_SIGNING_KEY: Y2ktc2lnbmluZy1rZXktMzItYnl0ZXMtbG9uZy0wMDAwMA==
      SLTO_BUNDLE_SIGNING_KEY_ID: ci-sign
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, wp-cli
          extensions: mysqli, sodium

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Exact-source quality gate
        id: source_quality
        shell: bash
        run: |
          set +e
          bash tools/quality-check.sh 2>&1 | tee "quality-${{ matrix.php }}.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload source-quality diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-log-${{ matrix.php }}
          path: quality-${{ matrix.php }}.log
          if-no-files-found: warn

      - name: Install WordPress and run MySQL integration suite
        shell: bash
        run: |
          set -euo pipefail
          db="cf06_${{ strategy.job-index }}"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE ${db} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          wpdir="/tmp/wp-${{ matrix.php }}"
          mkdir -p "$wpdir"
          wp core download --path="$wpdir" --force
          wp config create --path="$wpdir" --dbname="$db" --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$wpdir" --url="http://cf06-${{ matrix.php }}.local" --title=CF06 --admin_user=admin --admin_password='Passw0rd!CF06' --admin_email=admin@example.test
          ln -s "$GITHUB_WORKSPACE" "$wpdir/wp-content/plugins/sabri-localization-translation-operations"
          wp plugin activate sabri-localization-translation-operations --path="$wpdir"
          wp eval-file "$GITHUB_WORKSPACE/tests/wp-integration.php" --path="$wpdir"

  package:
    name: deterministic package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Build exact-commit candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 tools/build-release.py

      - name: Verify manifest, checksum, ZIP and deterministic rebuild parity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          unzip -t dist/*.zip
          first=$(sha256sum dist/*.zip | awk '{print $1}')
          python3 tools/build-release.py >/tmp/rebuild.txt
          second=$(sha256sum dist/*.zip | awk '{print $1}')
          test "$first" = "$second"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cf-06-complete-source-candidate-rc2
          path: |
            dist/*.zip
            dist/MANIFEST.json
            dist/SBOM.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
