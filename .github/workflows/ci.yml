name: CF-06 Quality Gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax lint
        run: composer lint

      - name: Unit tests
        run: composer test

      - name: Secret-pattern guard
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=vendor 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' .; then
            echo "Potential secret material detected."
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic candidate ZIP
        run: |
          mkdir -p build/sabri-localization-translation-operations
          rsync -a ./ build/sabri-localization-translation-operations/ \
            --exclude .git --exclude .github --exclude build --exclude vendor \
            --exclude tests --exclude phpunit.xml.dist --exclude composer.lock
          find build/sabri-localization-translation-operations -type f -exec touch -t 202608050000 {} +
          cd build
          zip -X -r cf-06-sabri-localization-translation-operations-0.1.0-FOUNDATION-CANDIDATE.zip sabri-localization-translation-operations
          sha256sum cf-06-sabri-localization-translation-operations-0.1.0-FOUNDATION-CANDIDATE.zip > SHA256SUMS
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-06-foundation-candidate
          path: |
            build/cf-06-sabri-localization-translation-operations-0.1.0-FOUNDATION-CANDIDATE.zip
            build/SHA256SUMS
