name: Repair CF-06 Reviewed RC3 Schema

on:
  push:
    branches: ['codex/cf-06-foundation-0.1.0']
    paths:
      - '.github/workflows/sync-cf06-final.yml'

permissions:
  contents: write

concurrency:
  group: cf06-reviewed-schema-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed RC3 branch
        uses: actions/checkout@v4
        with:
          ref: codex/cf-06-forty-round-reviewed-rc3
          fetch-depth: 0

      - name: Repair dbDelta-compatible index layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Infrastructure/Activator.php')
          source = path.read_text(encoding='utf-8')
          repaired = source.replace(', UNIQUE KEY ', ',\n                UNIQUE KEY ')
          repaired = repaired.replace(', KEY ', ',\n                KEY ')
          if repaired == source:
              raise SystemExit('No dbDelta index-layout repair was applied.')
          path.write_text(repaired, encoding='utf-8')
          PY
          php -l src/Infrastructure/Activator.php
          bash tools/quality-check.sh

      - name: Commit and publish schema repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Infrastructure/Activator.php
          git diff --cached --check
          git commit -m 'fix: make CF-06 schema compatible with dbDelta'
          git push origin HEAD:codex/cf-06-forty-round-reviewed-rc3
