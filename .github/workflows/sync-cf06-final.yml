name: Apply CF-06 Forty-Round Corrections

on:
  push:
    branches: ['codex/cf-06-foundation-0.1.0']
    paths:
      - '.cf06-sync/**'
      - '.github/workflows/sync-cf06-final.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: cf06-final-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: codex/cf-06-foundation-0.1.0
          fetch-depth: 0

      - name: Reconstruct and verify correction payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .cf06-sync/part-*
          sha256sum .cf06-sync/part-*
          cat .cf06-sync/part-* | tr -cd 'A-Za-z0-9+/=' | base64 --decode > /tmp/cf06-final.tar.gz
          echo 'b7c7117b3dd829a58f90b6e34fa5bffa175117b2f55dc3081a31c849341948fe  /tmp/cf06-final.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cf06-final.tar.gz -C .
          chmod +x tools/quality-check.sh tools/build-release.py

      - name: Normalize documentation whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' \
            docs/CODING-COMPLETION-REPORT.md \
            docs/FORTY-ROUND-REVIEW-CORRECTION-LEDGER.md

      - name: Remove temporary and superseded payload material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cf06-fixed .cf06-payload .cf06-sync
          rm -f .github/workflows/export-source-for-review.yml
          rm -f .github/workflows/sync-cf06-final.yml

      - name: Run corrected exact-source gate before push
        shell: bash
        run: bash tools/quality-check.sh

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: complete forty-round CF-06 review and correction'
          git push origin HEAD:codex/cf-06-foundation-0.1.0

      - name: Dispatch exact-head complete quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"codex/cf-06-foundation-0.1.0\"}"
